<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Effects Login/SignUp Page</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body{font-family: 'poppins', sans-serif;}
        .container{width: 100%;height: 100vh;display: flex; justify-content: center; align-items: center;}
        .flip-container{width: 450px;height: 550px;border-radius: 10px;padding: 20px; perspective: 1000px; /* 3D depth deta hai */}
        .flip-card{width: 100%;height: 100%; position: relative;transform-style: preserve-3d;transition: transform 0.6s ease;}
        .front-card{background-color: rgb(247, 232, 213);}
        .back-card{background-color: rgb(216, 245, 245);transform: rotateY(180deg);}
        .front-card, .back-card {position: absolute;width: 100%;height: 100%;backface-visibility:hidden;border-radius: 10px;}
        .flip-container:hover .flip-card{transform: rotateY(180deg);}
        
        /* Login CSS */
        .login_card {display: flex; flex-direction: column; justify-content: center; gap: 20px; min-height: 480px; width: 350px;background-color: #fff;border-radius: 20px;padding: 20px;}
        .email_input,.password_input,.loginbtn{width: 100%;text-align: center;display: flex;flex-direction: column;}
        #loginForm input {width: 100%; padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none;}
        #loginForm input:focus {border-color: #ff0000;}
        .loginbtn button { width: 100%; padding: 12px; background-color: #6c63ff; color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }        
        #loginForm a { text-decoration: none; color: #333; font-size: 14px; }
        #loginForm a span { color: #6c63ff; font-weight: bold; }
        #loginForm, #signupForm {display: flex;flex-direction: column; height: 100%;gap: 20px; padding: 20px; text-align: center;}    
        #signupForm input {width: 100%;padding: 10px 15px;border: 2px solid #e0e0e0;border-radius: 10px;font-size: 16px;outline: none;}
        #signupForm input:focus { border-color: #ff0000; }
        #signupForm button {width: 100%;padding: 12px;background-color: #6c63ff;color: #fff;border: none;border-radius: 10px;cursor: pointer;}

    </style>
</head>
<body>
    <div class="container">
        <div class="flip-container">
            <div class="flip-card">
                <div class="front-card">
                    <div id="loginForm">
                    <div class="cardName">
                    <h2>Login</h2>
                </div>
                <div class="email_input">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
                <div class="password_input">
                    <label for="password">Password</label>
                    <input type="password" id="password">
                </div>
                <div class="loginbtn">
                    <button>Login</button>
                </div>
                <a href="#">Don't have account <span>Sign Up</span></a>                     
            </div>
                </div>
                <div class="back-card">
                    <div id="signupForm">
                <!-- Sign Up form -->
                <div class="signupCardName">
                    <h2>Sign Up</h2>
                </div>
                <div class="signupName_input">
                    <label for="name">Name</label>
                    <input type="text" id="name">
                </div>
                <div class="sigupEmail_input">
                    <label for="signemail">Email</label>
                    <input type="email" id="SignUpEmail">
                </div>
                <div class="SignupPassword">
                    <label for="signuppassword">Password</label>
                    <input type="password" id="signupPassword"/>
                </div>
                <div class="confirmSignupPassword">
                    <label for="confirmSignupPassword">Confirm Password</label>
                    <input type="password" id="confirmSignupPassword"/>
                </div>
                <div class="signupbtn">
                    <button>Sign Up</button>
                </div>
                <a href="#">If You have already account <span>Login</span></a>
                </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
