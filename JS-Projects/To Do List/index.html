<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .todo-list{
            background: rgb(194, 154, 154);
            width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            gap: 10px;
        }
        .todo-list input {
            padding: 10px;
            border-radius: 8px;
            border: none;
        }
        .todo-list button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgb(194, 154, 154);
        }
        .todo-list button:hover {
            background-color: rgb(197, 131, 131);
            border: 1px solid black;
        } 
    </style>
</head>
<body>
    <div class="todo-list">
        <h2>My TO DO List</h2>
        <input type="text" id="taskInput" placeholder="Enter task......">
        <button id="addBtn">Add</button>
    </div>
    <ul id="taskList">
        <!-- <li>Task Text<button class="deleteBtn">Delete</button></li> -->

    </ul>

    <script>
        let taskInput = document.getElementById("taskInput");
        let addBtn = document.getElementById("addBtn");
        let taskList = document.getElementById("taskList");
        

        addBtn.addEventListener("click", () => {
            let text = taskInput.value;
            let li = document.createElement("li");
            li.textContent = text;
            taskList.appendChild(li);
            taskInput.value = "";
            
            let deleteBtn = document.createElement("button");
            deleteBtn.textContent="Delete";
            li.appendChild(deleteBtn);
            // deleteBtn.addEventListener("click", () => {
            //     deleteBtn.parentElement.remove();
                deleteBtn.addEventListener("click", (e) => {
                    e.currentTarget.parentElement.remove();
                });
            let saved = localStorage.getItem("task");
            let task = JSON.parse(saved) || [];
            
            task.push(text);
            localStorage.setItem("task", JSON.stringify(task));
            });
        
        


    </script>

</body>
</html>
