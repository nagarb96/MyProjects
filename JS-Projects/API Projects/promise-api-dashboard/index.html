<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Promise API Data Dashboard</title>
</head>
<body>
    <header>
        <h1>User Dashboard</h1>
        <button id="refreshBtn">Refresh users</button>
    </header>
    <main>
        <input type="text" id="searchInput" placeholder="Search users by name...">
        <button id="clearSearchBtn">Clear Search</button>
        <button id="sortBtn">Sort by Name A–Z</button>
        <p id="status">Click refresh to load users.</p>

        <section id="usersContainer">
            <!-- User Cards -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
