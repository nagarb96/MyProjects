<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User using PUT vs PATCH</title>
    <style>

    </style>
</head>
<body>
    <h2>Update User</h2>
    <input type="number" id="userIdInput" placeholder="User ID">
    

    <button id="updateUserBtn">UpdateUser</button>
    
    <script>
        const userIdInput = document.getElementById("userIdInput");
        const updateBtn = document.getElementById("updateUserBtn");
        const url = `https://jsonplaceholder.typicode.com/users/`;
        updateBtn.addEventListener("click", async() => {
            const newUrl = url + userIdInput.value;
            
            try {
                const response = await fetch(newUrl, {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });
                if(!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                const data = await response.json();
                console.log(data);
                console.log(`User with ID ${userIdInput.value} has been deleted successfully.`);
            }
            catch(error) {
                console.log(error.message);
            }
            
        });
        
            
    </script>
</body>
</html>
